server.port=8080

# PostgreSQL Configuration - valores directos (las variables de entorno
# se cargan desde el .bat al correr el servicio; aqui quedan los defaults locales)
spring.datasource.url=jdbc:postgresql://localhost:5432/apuestas
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Hibernate no debe alterar el esquema, ya que es gestionado por el script DB (schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.apuestas=DEBUG
